name: Build PX4 ports

on:
  push:
    branches:
      - master
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Storage and build regression checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: port
      - uses: actions/checkout@v7
        with:
          repository: PX4/PX4-Autopilot
          ref: 99c40407ffd7ac184e2d7b4b293f36f10fe561ef # v1.15.4
          path: PX4-Autopilot
      - name: Test installer and firmware rejection paths
        working-directory: port
        run: python3 -m unittest discover -s tests -v
      - name: Install and verify pinned storage changes
        run: |
          python3 port/scripts/install.py PX4-Autopilot
          python3 port/scripts/check_storage.py PX4-Autopilot

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    container: px4io/px4-dev-nuttx-focal:2022-08-12
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        target:
          - orqa_h7quadcore_default
          - orqa_h7quadcore_bootloader
          - orqa_h7wingcore_default
          - orqa_h7wingcore_bootloader
          - orqa_apb_default
          - orqa_apb_bootloader
          - orqa_f405pro_default

    steps:
      - name: Check out port repository
        uses: actions/checkout@v7
        with:
          path: port

      - name: Check out PX4 v1.15.4
        uses: actions/checkout@v7
        with:
          repository: PX4/PX4-Autopilot
          ref: 99c40407ffd7ac184e2d7b4b293f36f10fe561ef # v1.15.4
          submodules: recursive
          path: PX4-Autopilot

      - name: Fetch NuttX version tags
        run: git -C PX4-Autopilot/platforms/nuttx/NuttX/nuttx fetch --tags --force

      - name: Install Orqa board definitions and storage fixes
        run: python3 port/scripts/install.py PX4-Autopilot

      - name: Build
        working-directory: PX4-Autopilot
        run: make ${{ matrix.target }}

      - name: Collect firmware
        run: |
          python3 port/scripts/check_firmware.py PX4-Autopilot ${{ matrix.target }}
          mkdir -p artifacts
          find "PX4-Autopilot/build/${{ matrix.target }}" -maxdepth 1 -type f \
            \( -name '*.px4' -o -name '*.bin' -o -name '*.manifest.json' \) -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: orqa_*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name '*.px4' | wc -l)" -eq 7
          test "$(find . -maxdepth 1 -name '*.bin' | wc -l)" -eq 7
          test "$(find . -maxdepth 1 -name '*.manifest.json' | wc -l)" -eq 7
          sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
