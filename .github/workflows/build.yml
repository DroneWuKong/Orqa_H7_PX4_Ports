name: Build PX4 ports

on:
  push:
    branches:
      - master
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Storage and build regression checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: port
      - uses: actions/checkout@v7
        with:
          repository: PX4/PX4-Autopilot
          ref: 99c40407ffd7ac184e2d7b4b293f36f10fe561ef # v1.15.4
          path: PX4-Autopilot
      - name: Test installer and firmware rejection paths
        working-directory: port
        run: python3 -m unittest discover -s tests -v
      - name: Install and verify pinned storage changes
        run: |
          git -C PX4-Autopilot fetch --depth=1 origin tag v1.15.4
          python3 port/scripts/install.py PX4-Autopilot
          python3 port/scripts/check_storage.py PX4-Autopilot

  logging:
    name: APB native ULog integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned companion recorder
        run: |
          python3 -m pip install meson==1.12.1 pymavlink==2.4.49 pyulog==1.3.0
          git clone https://github.com/mavlink-router/mavlink-router.git /tmp/mavlink-router
          git -C /tmp/mavlink-router checkout 42529d55b665e0a9a29e424e186f514c56c2e5b5
          git -C /tmp/mavlink-router submodule update --init --recursive
          meson setup /tmp/mavlink-router/build /tmp/mavlink-router -Dsystemdsystemunitdir=/lib/systemd/system
          ninja -C /tmp/mavlink-router/build src/mavlink-routerd
      - name: Test capture, packet recovery and SD supervisor
        env:
          MAVLINK_ROUTER_BIN: /tmp/mavlink-router/build/src/mavlink-routerd
        run: python3 tests/probe_apb_router.py
      - name: Package companion installation files
        run: tar --exclude=__pycache__ -czf orqa-apb-companion.tar.gz -C companion apb
      - uses: actions/upload-artifact@v7
        with:
          name: orqa_apb_companion
          path: orqa-apb-companion.tar.gz
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    container: px4io/px4-dev-nuttx-focal:2022-08-12@sha256:30881ed09e03f0512ac84351c75a4b564431cad868aca8634b033042c153e6c4
    needs: [checks, logging]
    strategy:
      fail-fast: false
      matrix:
        target:
          - orqa_h7quadcore_default
          - orqa_h7quadcore_bootloader
          - orqa_h7wingcore_default
          - orqa_h7wingcore_bootloader
          - orqa_apb_default
          - orqa_apb_bootloader
          - orqa_f405pro_default

    steps:
      - name: Check out port repository
        uses: actions/checkout@v7
        with:
          path: port

      - name: Check out PX4 v1.15.4
        uses: actions/checkout@v7
        with:
          repository: PX4/PX4-Autopilot
          ref: 99c40407ffd7ac184e2d7b4b293f36f10fe561ef # v1.15.4
          submodules: recursive
          path: PX4-Autopilot

      - name: Fetch NuttX version tags
        run: |
          git -C PX4-Autopilot fetch --depth=1 origin tag v1.15.4
          git -C PX4-Autopilot/platforms/nuttx/NuttX/nuttx fetch --tags --force

      - name: Install Orqa board definitions and storage fixes
        run: python3 port/scripts/install.py PX4-Autopilot

      - name: Build
        working-directory: PX4-Autopilot
        run: make ${{ matrix.target }}

      - name: Collect firmware
        run: |
          python3 port/scripts/check_firmware.py PX4-Autopilot ${{ matrix.target }}
          if [ '${{ matrix.target }}' = orqa_apb_default ]; then
            python3 port/scripts/check_apb_logging.py PX4-Autopilot/build/orqa_apb_default
          fi
          mkdir -p artifacts
          find "PX4-Autopilot/build/${{ matrix.target }}" -maxdepth 1 -type f \
            \( -name '*.px4' -o -name '*.bin' -o -name '*.manifest.json' \) -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Retain diagnostics for a failed build or artifact check
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            PX4-Autopilot/build/${{ matrix.target }}/*.elf
            PX4-Autopilot/build/${{ matrix.target }}/*.bin
            PX4-Autopilot/build/${{ matrix.target }}/*.px4
            PX4-Autopilot/build/${{ matrix.target }}/parameters.xml
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: orqa_*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name '*.px4' | wc -l)" -eq 7
          test "$(find . -maxdepth 1 -name '*.bin' | wc -l)" -eq 7
          test "$(find . -maxdepth 1 -name '*.manifest.json' | wc -l)" -eq 7
          test -s orqa-apb-companion.tar.gz
          sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
